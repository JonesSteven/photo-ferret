<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Admin · Photo Ferret</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='23' cy='9' r='4' fill='%23e3a34a'/%3E%3Cpath d='M1 28 11 11l6 9 4-5 10 13z' fill='%232f5d43'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body class="admin">
    <header class="admin-bar">
      <a id="brand" class="brand" href="/">Photo Ferret</a>
      <span class="brand-tag">Admin</span>
      <span id="jev-status" class="jev-status"></span>
      <nav class="admin-nav">
        <a href="/">View site</a>
        <a href="/preview/" title="The last npm run export-site, as it will be deployed">Preview export</a>
        <button id="logout" class="link-btn" type="button" hidden>Sign out</button>
      </nav>
    </header>

    <main>
      <section id="login-view" class="login card" hidden>
        <h1>Sign in</h1>
        <form id="login-form">
          <label>Username <input name="user" autocomplete="username" required /></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
          <button class="btn" type="submit">Sign in</button>
          <p id="login-error" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section id="app-view" hidden>
        <label id="drop" class="drop drop-admin" tabindex="0">
          <input id="file" type="file" multiple accept="image/*,.heic,.heif,.dng,.cr2,.cr3,.nef,.arw,.orf,.raf,.rw2" hidden />
          <svg class="drop-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="34" cy="14" r="5" /><path d="M4 40 18 18l9 13 6-7 11 16z" /></svg>
          <span class="drop-title">Drop photos here, or <u>choose files</u></span>
          <span class="drop-hint">Originals are kept at full resolution · up to 100 MB each · Jev tags them automatically</span>
        </label>
        <ul id="uploads" class="uploads"></ul>

        <div id="error" class="error" role="alert" hidden></div>

        <fieldset class="settings card">
          <legend>Gallery options</legend>
          <label class="field site-title">Site name <input id="set-title" required /></label>
          <label class="field about-text"
            >About text
            <textarea id="set-about" rows="5" placeholder="A few words about you and your photos, and an email address if you like."></textarea>
            <span class="muted hint">Shown at the top of the About page. Blank lines start a new paragraph; email addresses and links become clickable.</span>
          </label>
          <span id="settings-status" class="muted" role="status"></span>
        </fieldset>

        <div class="toolbar">
          <div id="status-seg" class="seg" role="radiogroup" aria-label="Show"></div>
          <span id="count" class="muted"></span>
          <button id="retag-all" class="btn btn-quiet" type="button">Re-tag all photos</button>
        </div>
        <p id="empty" class="empty-state" hidden>No photos yet. Drop some above.</p>
        <section id="grid" class="grid admin-grid"></section>
      </section>
    </main>

    <dialog id="editor" class="editor" aria-label="Edit photo">
      <div class="editor-media">
        <div class="frame">
          <img id="ed-img" alt="" />
          <div id="ed-busy" class="busy" hidden><div class="spinner"></div><span id="ed-busy-text">Asking Jev…</span></div>
        </div>
        <p id="ed-file" class="muted small"></p>
        <div class="editor-actions">
          <a id="ed-download" class="btn btn-quiet" download>Download original</a>
          <button id="ed-rerun" class="btn btn-quiet" type="button">Re-run Jev</button>
          <button id="ed-delete" class="btn btn-danger" type="button">Delete</button>
        </div>
      </div>
      <div class="editor-form">
        <button id="ed-close" class="lb-close" type="button" aria-label="Close">×</button>
        <p id="ed-status" class="ed-status"></p>
        <label class="field">Title <input id="ed-title" maxlength="200" placeholder="Untitled" /></label>
        <label class="field">Description <textarea id="ed-desc" rows="2" maxlength="2000"></textarea></label>
        <label class="toggle"><input id="ed-published" type="checkbox" /> Visible on the public site</label>

        <h2 class="section-title">Tags</h2>
        <p class="muted small">Each tag uses Jev's answer unless you override it. Overrides are kept when Jev is re-run.</p>
        <div id="ed-attrs" class="attr-table"></div>
        <p id="ed-saved" class="saved" aria-live="polite"></p>
      </div>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
